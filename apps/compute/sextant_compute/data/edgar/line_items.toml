# Unified line items for the standardized financial statements (P1, P2, P7).
#
# Data, not code: the EDGAR adapter reads this file to turn a company's XBRL
# facts (SEC companyfacts) into the same named items for every company.
#
# Each [[item]]:
#   id         stable identifier used in APIs and metric ids (snake_case; never rename)
#   label      display name, also used in "missing" reasons
#   statement  "income" | "balance" | "cash_flow" (balance items are instants at
#              the fiscal year end; the others are durations of about a year)
#   unit       XBRL unit key in companyfacts: "USD", "USD/shares" or "shares"
#   tags       candidate XBRL tags, "<taxonomy>:<tag>", in priority order. For EACH
#              fiscal period the first tag with a value for that period wins, so a
#              tag the company stopped using doesn't block a newer one.
#   derive     optional fallback when no tag has a value: other item ids joined by
#              " + " / " - " (e.g. "revenue - cost_of_revenue"). Every input must
#              have a value for that period.
#   display    optional, default true. false = a helper item (an input to a derive
#              formula) that the statements page doesn't show; APIs still return it.
#
# Order of items here is display order. Changing this file changes the adapter
# output: bump EdgarAdapter.version (cache entries outlive deploys).

# --- Income statement -------------------------------------------------------

[[item]]
id = "revenue"
label = "Revenue"
statement = "income"
unit = "USD"
tags = [
  "us-gaap:Revenues",
  "us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax",
  "us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax",
  "us-gaap:RevenuesNetOfInterestExpense",
  "us-gaap:SalesRevenueNet",
]

[[item]]
id = "cost_of_revenue"
label = "Cost of Revenue"
statement = "income"
unit = "USD"
tags = [
  "us-gaap:CostOfGoodsAndServicesSold",
  "us-gaap:CostOfRevenue",
  "us-gaap:CostOfGoodsSold",
  "us-gaap:CostOfGoodsAndServicesSoldExcludingDepreciationDepletionAndAmortization",
]

[[item]]
id = "gross_profit"
label = "Gross Profit"
statement = "income"
unit = "USD"
tags = ["us-gaap:GrossProfit"]
derive = "revenue - cost_of_revenue"

